<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow4" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <rect width="1000" height="480" rx="16" fill="url(#bg-grad-4)" />
  <rect x="2" y="2" width="996" height="476" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20">Vendor Intelligence — Machine Learning Inference Pipeline</text>
    <text x="0" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Feature scaling, Random Forest classification &amp; Linear Regression freight cost model execution</text>
  </g>

  <!-- PIPELINE 1: Invoice Risk Classification -->
  <g transform="translate(40, 95)" filter="url(#shadow4)">
    <rect width="920" height="160" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <text x="20" y="25" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">Pipeline 1: Invoice Risk Flag Classifier (RandomForestClassifier)</text>

    <g transform="translate(20, 45)">
      <!-- Features Box -->
      <rect width="200" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">5 Input Features</text>
      <text x="15" y="40" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Invoice Quantity &amp; Dollars</text>
      <text x="15" y="58" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Freight Cost</text>
      <text x="15" y="76" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">• PO Quantity &amp; PO Dollars</text>

      <!-- Arrow -->
      <path d="M 205 45 L 245 45" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>

      <!-- Scaler Box -->
      <rect x="250" width="200" height="90" rx="8" fill="#0f172a" stroke="#312e81" stroke-width="1"/>
      <text x="265" y="22" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">Feature Scaler</text>
      <text x="265" y="42" fill="#cbd5e1" font-family="monospace" font-size="11">scaler.pkl</text>
      <text x="265" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">StandardScaler Z-Score</text>
      <text x="265" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Normalization</text>

      <!-- Arrow -->
      <path d="M 455 45 L 495 45" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>

      <!-- Model Box -->
      <rect x="500" width="210" height="90" rx="8" fill="#0f172a" stroke="#4c1d95" stroke-width="1"/>
      <text x="515" y="22" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">Random Forest</text>
      <text x="515" y="42" fill="#cbd5e1" font-family="monospace" font-size="11">predict_flag_invoice.pkl</text>
      <text x="515" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Decision Trees Ensemble</text>
      <text x="515" y="76" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">predict_proba() scoring</text>

      <!-- Arrow -->
      <path d="M 715 45 L 755 45" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>

      <!-- Output Box -->
      <rect x="760" width="115" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="817" y="25" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">Output</text>
      <text x="817" y="48" text-anchor="middle" fill="#ef4444" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="11">FLAGGED (1)</text>
      <text x="817" y="64" text-anchor="middle" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="11">CLEARED (0)</text>
      <text x="817" y="80" text-anchor="middle" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="10">Confidence %</text>
    </g>
  </g>

  <!-- PIPELINE 2: Freight Cost Regression -->
  <g transform="translate(40, 280)" filter="url(#shadow4)">
    <rect width="920" height="160" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="25" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">Pipeline 2: Freight Cost Estimator (LinearRegression)</text>

    <g transform="translate(20, 45)">
      <!-- Features Box -->
      <rect width="250" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">Input Feature</text>
      <text x="15" y="45" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Invoice Amount ($)</text>
      <text x="15" y="68" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Dollar amount of the purchase</text>

      <!-- Arrow -->
      <path d="M 255 45 L 345 45" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>

      <!-- Model Box -->
      <rect x="350" width="350" height="90" rx="8" fill="#0f172a" stroke="#065f46" stroke-width="1"/>
      <text x="15" y="22" transform="translate(350,0)" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">Linear Regression Model</text>
      <text x="15" y="42" transform="translate(350,0)" fill="#cbd5e1" font-family="monospace" font-size="11">predict_freight_model.pkl</text>
      <text x="15" y="64" transform="translate(350,0)" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Calculates baseline freight quote prediction</text>

      <!-- Arrow -->
      <path d="M 705 45 L 755 45" stroke="#10b981" stroke-width="2" marker-end="url(#arr2)"/>

      <!-- Output Box -->
      <rect x="760" width="115" height="90" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="817" y="25" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="12">Output</text>
      <text x="817" y="52" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="13">Freight ($)</text>
      <text x="817" y="72" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Estimated cost</text>
    </g>
  </g>
</svg>