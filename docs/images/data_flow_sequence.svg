<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <rect width="1000" height="560" rx="16" fill="url(#bg-grad-2)" />
  <rect x="2" y="2" width="996" height="556" rx="14" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <g transform="translate(40, 35)">
    <text x="0" y="20" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="20">Vendor Intelligence — End-to-End Request &amp; Execution Lifecycle</text>
    <text x="0" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">Step-by-step trace of single inference requests and bulk CSV batch ingestion</text>
  </g>

  <!-- Flow Steps Box Grid -->
  <g transform="translate(40, 95)">
    <!-- STEP 1 -->
    <g transform="translate(0, 0)" filter="url(#shadow2)">
      <rect width="270" height="180" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#2563eb"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">1</text>
      <text x="52" y="34" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">User Form / CSV Input</text>
      
      <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Enter invoice details or upload batch CSV</text>
      <text x="15" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Client JS triggers fetch() API call</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Async payload packaging (JSON / Form)</text>
      <rect x="15" y="135" width="240" height="30" rx="6" fill="#0f172a"/>
      <text x="135" y="154" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">POST /api/invoice/predict</text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <path d="M 275 90 L 320 90" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- STEP 2 -->
    <g transform="translate(325, 0)" filter="url(#shadow2)">
      <rect width="270" height="180" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#4f46e5"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">2</text>
      <text x="52" y="34" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">FastAPI &amp; Validation</text>

      <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• CORS check &amp; router dispatch</text>
      <text x="15" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Pydantic schema validation check</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Batch SHA256 hashing for dedup</text>
      <rect x="15" y="135" width="240" height="30" rx="6" fill="#0f172a"/>
      <text x="135" y="154" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">schemas.InvoiceInput</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <path d="M 600 90 L 645 90" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- STEP 3 -->
    <g transform="translate(650, 0)" filter="url(#shadow2)">
      <rect width="270" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#059669"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">3</text>
      <text x="52" y="34" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">ML Model Inference</text>

      <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Standard scaling via scaler.pkl</text>
      <text x="15" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Random Forest flag prediction</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Linear Regression freight estimation</text>
      <rect x="15" y="135" width="240" height="30" rx="6" fill="#0f172a"/>
      <text x="135" y="154" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">predict_flag_invoice.pkl</text>
    </g>

    <!-- Arrow 3 down to 4 -->
    <path d="M 785 185 L 785 220" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- STEP 4 -->
    <g transform="translate(650, 230)" filter="url(#shadow2)">
      <rect width="270" height="180" rx="12" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#0284c7"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">4</text>
      <text x="52" y="34" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">Database Persistence</text>

      <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• SQLAlchemy ORM transaction</text>
      <text x="15" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Write record to invoice_predictions</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Auto-commit to PostgreSQL / SQLite</text>
      <rect x="15" y="135" width="240" height="30" rx="6" fill="#0f172a"/>
      <text x="135" y="154" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">SQLAlchemy Session.commit()</text>
    </g>

    <!-- Arrow 4 -> 5 -->
    <path d="M 645 320 L 600 320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- STEP 5 -->
    <g transform="translate(325, 230)" filter="url(#shadow2)">
      <rect width="270" height="180" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#d97706"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">5</text>
      <text x="52" y="34" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">JSON Response</text>

      <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Format output with risk probability</text>
      <text x="15" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Return HTTP 200 OK payload</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Clear error code on validation failure</text>
      <rect x="15" y="135" width="240" height="30" rx="6" fill="#0f172a"/>
      <text x="135" y="154" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">{"predicted_flag": 1, ...}</text>
    </g>

    <!-- Arrow 5 -> 6 -->
    <path d="M 320 320 L 275 320" stroke="#38bdf8" stroke-width="2" marker-end="url(#arr)"/>

    <!-- STEP 6 -->
    <g transform="translate(0, 230)" filter="url(#shadow2)">
      <rect width="270" height="180" rx="12" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5"/>
      <rect x="15" y="15" width="28" height="28" rx="6" fill="#7c3aed"/>
      <text x="29" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">6</text>
      <text x="52" y="34" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-weight="bold" font-size="14">Dynamic UI Rendering</text>

      <text x="15" y="70" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Render CLEARED / FLAGGED Stamp</text>
      <text x="15" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Display Freight cost estimate badge</text>
      <text x="15" y="114" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Update Recent Entries table live</text>
      <rect x="15" y="135" width="240" height="30" rx="6" fill="#0f172a"/>
      <text x="135" y="154" text-anchor="middle" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold">Stamp &amp; History Updated</text>
    </g>
  </g>

  <!-- Summary Footer -->
  <rect x="40" y="495" width="920" height="35" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="500" y="517" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    ⚡ High-Performance Architecture: Average REST latency &lt; 25ms | Automatic PO Cross-referencing &amp; Dedup
  </text>
</svg>